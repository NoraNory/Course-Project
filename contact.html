<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>LearnHub</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="index.html#courses">Courses</a>
    </nav>
</header>

<section class="details">

    <div style="flex:1; min-width:300px;">
        <h2>Contact Us</h2>
        <p>
            Feel free to reach out anytime.  
            You can send us a message using the form below.
        </p>

        <form style="margin-top:20px;">
            <label>Name</label>
            <input type="text" style="width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #ccc;">

            <label>Email</label>
            <input type="email" style="width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #ccc;">

            <label>Your Message</label>
            <textarea style="width:100%; padding:10px; height:120px; margin:10px 0; border-radius:6px; border:1px solid #ccc;"></textarea>

            <button style="padding:10px 20px; background:#1e3a8a; color:white; border:none; border-radius:6px; cursor:pointer;">
                Send
            </button>
        </form>
    </div>

</section>

<footer>
    <p>© 2026 LearnHub</p>
</footer>

</body>
</html>
